<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570">
<rect width="1100" height="570" fill="#F7F8FA"/>
<text x="55" y="52" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#111827">Uncertainty should adapt to the market</text>
<text x="55" y="80" font-family="Inter,Arial,sans-serif" font-size="14" fill="#667085">Empirical 90% interval calibration by Zillow size-rank cohort</text>
<text x="55" y="125" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#344054">GLOBAL INTERVAL</text>
<line x1="270" y1="110" x2="270" y2="260" stroke="#D0D5DD" stroke-width="1"/>
<line x1="270" y1="210" x2="1000" y2="210" stroke="#D0D5DD" stroke-width="1" stroke-dasharray="4 4"/>
<text x="1008" y="214" font-family="Inter,Arial,sans-serif" font-size="11" fill="#667085">90%</text>
<g font-family="Inter,Arial,sans-serif" font-size="13" fill="#344054">
<text x="55" y="160">Top 100</text><rect x="270" y="143" width="699" height="22" rx="4" fill="#98A2B3"/><text x="980" y="160">96.28%</text>
<text x="55" y="195">Ranks 101–300</text><rect x="270" y="178" width="702" height="22" rx="4" fill="#98A2B3"/><text x="983" y="195">96.62%</text>
<text x="55" y="230">Rank 301+</text><rect x="270" y="213" width="640" height="22" rx="4" fill="#D92D20"/><text x="921" y="230">88.01%</text>
</g>
<text x="55" y="292" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#344054">SIZE-COHORT CONDITIONAL INTERVAL</text>
<line x1="270" y1="277" x2="270" y2="435" stroke="#D0D5DD" stroke-width="1"/>
<g font-family="Inter,Arial,sans-serif" font-size="13" fill="#344054">
<text x="55" y="330">Top 100</text><rect x="270" y="313" width="648" height="22" rx="4" fill="#006AFF"/><text x="929" y="330">89.15% · width 3.182 pp</text>
<text x="55" y="370">Ranks 101–300</text><rect x="270" y="353" width="656" height="22" rx="4" fill="#006AFF"/><text x="937" y="370">90.17% · width 3.091 pp</text>
<text x="55" y="410">Rank 301+</text><rect x="270" y="393" width="661" height="22" rx="4" fill="#006AFF"/><text x="942" y="410">90.86% · width 4.245 pp</text>
</g>
<text x="55" y="470" font-family="Inter,Arial,sans-serif" font-size="13" fill="#667085">Smaller markets require wider uncertainty bands; one global width hides this heterogeneity.</text>
<text x="55" y="505" font-family="Inter,Arial,sans-serif" font-size="12" fill="#98A2B3">Coverage is empirical, not a formal iid conformal guarantee, because metro-month observations are dependent.</text>
</svg>