sources:
  zhvi:
    name: Zillow Home Value Index
    metric: zhvi
    url: https://files.zillowstatic.com/research/public_csvs/zhvi/Metro_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv
    geography: metro
    frequency: monthly
    value_type: currency
    role: target_and_price_momentum

  zori:
    name: Zillow Observed Rent Index
    metric: zori
    url: https://files.zillowstatic.com/research/public_csvs/zori/Metro_zori_uc_sfrcondomfr_sm_month.csv
    geography: metro
    frequency: monthly
    value_type: currency
    role: rent_demand_signal

  inventory:
    name: For-Sale Inventory
    metric: inventory
    url: https://files.zillowstatic.com/research/public_csvs/invt_fs/Metro_invt_fs_uc_sfrcondo_sm_month.csv
    geography: metro
    frequency: monthly
    value_type: count
    role: supply_stock_signal

  new_listings:
    name: New Listings
    metric: new_listings
    url: https://files.zillowstatic.com/research/public_csvs/new_listings/Metro_new_listings_uc_sfrcondo_sm_month.csv
    geography: metro
    frequency: monthly
    value_type: count
    role: supply_flow_signal

  price_cut_share:
    name: Share of Listings With a Price Cut
    metric: price_cut_share
    url: https://files.zillowstatic.com/research/public_csvs/perc_listings_price_cut/Metro_perc_listings_price_cut_uc_sfrcondo_sm_month.csv
    geography: metro
    frequency: monthly
    value_type: share
    role: seller_pressure_signal

  days_to_pending:
    name: Mean Days to Pending
    metric: days_to_pending
    url: https://files.zillowstatic.com/research/public_csvs/mean_doz_pending/Metro_mean_doz_pending_uc_sfrcondo_sm_month.csv
    geography: metro
    frequency: monthly
    value_type: days
    role: market_velocity_signal

  market_heat:
    name: Zillow Market Heat Index
    metric: market_heat
    url: https://files.zillowstatic.com/research/public_csvs/market_temp_index/Metro_market_temp_index_uc_sfrcondo_month.csv
    geography: metro
    frequency: monthly
    value_type: index
    role: supply_demand_balance

metadata_columns:
  - RegionID
  - SizeRank
  - RegionName
  - RegionType
  - StateName
