name: Release hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and lint
        run: |
          ruff check .
          pytest -q

      - name: Download current Zillow Research data
        run: python -m src.ingestion.download

      - name: Build canonical mart
        run: |
          python -m src.transformation.build_interim
          python -m src.transformation.build_mart

      - name: Run release hardening analysis
        run: python -m src.release.robustness

      - name: Print release report
        run: cat outputs/release/release_report.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-hardening
          path: outputs/release
          retention-days: 14
