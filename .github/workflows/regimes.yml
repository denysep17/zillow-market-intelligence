name: Regime discovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regimes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Download live Zillow Research data
        run: python -m src.ingestion.download

      - name: Normalize data
        run: python -m src.transformation.build_interim

      - name: Build metro-only mart
        run: python -m src.transformation.build_mart

      - name: Run regime discovery
        run: python -m src.regimes.experiment

      - name: Print regime report
        run: cat outputs/reports/regime_report.md

      - name: Upload regime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regime-discovery
          path: |
            outputs/reports/regime_summary.json
            outputs/reports/regime_report.md
            outputs/reports/regime_assignments.parquet
            outputs/reports/rule_regime_distribution.csv
            outputs/reports/rule_regime_latest.csv
            outputs/reports/rule_regime_forward_outcomes.csv
            outputs/reports/rule_regime_transition_matrix.csv
            outputs/reports/cluster_regime_distribution.csv
            outputs/reports/cluster_regime_transition_matrix.csv
          retention-days: 14
