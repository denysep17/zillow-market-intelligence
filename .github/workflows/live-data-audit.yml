name: Live Zillow data audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Download live Zillow Research sources
        run: python -m src.ingestion.download

      - name: Normalize source datasets
        run: python -m src.transformation.build_interim

      - name: Build real market-month mart
        run: python -m src.transformation.build_mart

      - name: Run baseline coverage audit
        run: python -m src.validation.audit

      - name: Run final panel audit
        run: python -m src.validation.final_audit

      - name: Audit optional candidate signals
        run: python -m src.validation.candidate_audit

      - name: Print audit outputs
        run: |
          echo "===== FINAL DATA AUDIT ====="
          cat outputs/reports/final_data_audit.json
          echo ""
          echo "===== CANDIDATE SIGNAL AUDIT ====="
          cat outputs/reports/candidate_signal_audit.json

      - name: Upload real mart and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: live-zillow-data-audit
          path: |
            data/processed/mart_market_monthly.parquet
            outputs/reports/
          retention-days: 14
