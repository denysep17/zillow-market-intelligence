name: Market diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Download live Zillow Research data
        run: python -m src.ingestion.download

      - name: Normalize data
        run: python -m src.transformation.build_interim

      - name: Build metro-only mart
        run: python -m src.transformation.build_mart

      - name: Run v0.2 market diagnostics
        run: python -m src.diagnostics.market_diagnostics

      - name: Print concise diagnostics report
        run: cat outputs/reports/market_diagnostics.md

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: market-diagnostics
          path: |
            outputs/reports/market_diagnostics.json
            outputs/reports/market_diagnostics.md
            outputs/figures/*.svg
          retention-days: 14
